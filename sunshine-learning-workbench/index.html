<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阳光学习能量站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark: #2d8f4e;
      --green-main: #3cb371;
      --green-light: #e8f5e9;
      --green-bg: #f0faf2;
      --sun: #ffb300;
      --sun-light: #fff8e1;
      --text: #2c3e2c;
      --text-muted: #5a7a5a;
      --card-shadow: 0 2px 12px rgba(45, 143, 78, 0.12);
      --radius: 14px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #e8f8ec 0%, #f5fff7 40%, #fffef5 100%);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--green-dark), var(--green-main));
      color: #fff;
      padding: 16px 20px 20px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 4px 20px rgba(45, 143, 78, 0.3);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-sun { font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    .logo-title { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .name-input {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      color: #fff;
      font-size: 15px;
      padding: 6px 14px;
      width: 120px;
      outline: none;
    }
    .name-input::placeholder { color: rgba(255,255,255,0.7); }
    .stats-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .stat-chip {
      background: rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(4px);
    }
    .stat-chip strong { font-size: 16px; }
    .header-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .btn-sm {
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      border-radius: 18px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.35); }
    .btn-sm.primary { background: var(--sun); border-color: var(--sun); color: #5d4037; font-weight: 600; }
    .btn-sm.primary:hover { background: #ffc107; }
    .btn-sm:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Layout */
    .main-layout {
      display: flex;
      gap: 0;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
      min-height: calc(100vh - 160px);
    }

    /* Sidebar */
    .sidebar {
      width: 72px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 8px;
    }
    .subject-btn {
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: #fff;
      box-shadow: var(--card-shadow);
      transition: all 0.2s;
    }
    .subject-btn .icon { font-size: 22px; }
    .subject-btn:hover { transform: translateY(-2px); }
    .subject-btn.active {
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    /* Content */
    .content { flex: 1; min-width: 0; }

    /* Today recommend */
    .recommend-panel {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow);
      border-left: 4px solid var(--sun);
    }
    .recommend-panel h3 {
      font-size: 15px;
      color: var(--green-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .recommend-list { display: flex; flex-direction: column; gap: 8px; }
    .recommend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--green-bg);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 14px;
    }
    .recommend-item:hover { background: var(--green-light); }
    .recommend-item .tag {
      font-size: 11px;
      background: var(--green-main);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .recommend-item .reward { margin-left: auto; color: var(--sun); font-size: 12px; font-weight: 600; }

    /* Subject header */
    .subject-header {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow);
    }
    .subject-header h2 {
      font-size: 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-wrap { display: flex; align-items: center; gap: 12px; }
    .progress-bar-bg {
      flex: 1;
      height: 10px;
      background: #eee;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.4s ease;
    }
    .progress-text { font-size: 14px; font-weight: 600; white-space: nowrap; }

    /* Unit cards */
    .units-grid { display: flex; flex-direction: column; gap: 14px; }
    .unit-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--card-shadow);
    }
    .unit-card h4 {
      font-size: 15px;
      color: var(--green-dark);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--green-light);
    }
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--green-bg);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .task-item:hover { background: var(--green-light); }
    .task-item.done {
      opacity: 0.65;
      background: #f5f5f5;
    }
    .task-item.done .task-name { text-decoration: line-through; color: #999; }
    .task-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--green-main);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      transition: all 0.2s;
    }
    .task-item.done .task-checkbox {
      background: var(--green-main);
      color: #fff;
      border-color: var(--green-main);
    }
    .task-name { flex: 1; font-size: 14px; }
    .task-reward {
      font-size: 12px;
      color: var(--sun);
      font-weight: 600;
      flex-shrink: 0;
    }

    /* Shop FAB */
    .shop-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sun), #ff8f00);
      border: none;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 143, 0, 0.45);
      transition: transform 0.2s;
      z-index: 100;
    }
    .shop-fab:hover { transform: scale(1.1); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .modal h3 {
      font-size: 18px;
      color: var(--green-dark);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal .balance {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .modal .balance strong { color: var(--sun); font-size: 18px; }
    .shop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-radius: 12px;
      background: var(--sun-light);
      margin-bottom: 10px;
    }
    .shop-item-info h4 { font-size: 15px; margin-bottom: 3px; }
    .shop-item-info p { font-size: 12px; color: var(--text-muted); }
    .shop-item .cost { font-size: 14px; font-weight: 700; color: var(--sun); margin-right: 10px; }
    .shop-btn {
      background: var(--sun);
      border: none;
      color: #5d4037;
      border-radius: 18px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .shop-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .modal-close {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: var(--green-light);
      border: none;
      border-radius: 12px;
      color: var(--green-dark);
      font-size: 14px;
      cursor: pointer;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--green-dark);
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 300;
      transition: transform 0.3s;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Hidden file input */
    #importFile { display: none; }

    .admin-entry {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.85);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .admin-entry.logged-in {
      background: rgba(255, 179, 0, 0.35);
      border-color: var(--sun);
    }
    .admin-panel-section {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #e0e0e0;
    }
    .admin-panel-section:last-child { border-bottom: none; margin-bottom: 0; }
    .admin-panel-section h4 {
      font-size: 14px;
      color: var(--green-dark);
      margin-bottom: 10px;
    }
    .admin-action-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ffcdd2;
      background: #fff5f5;
      color: #c62828;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .admin-action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: #eee;
      background: #f9f9f9;
      color: #999;
    }
    .admin-action-btn.secondary {
      border-color: var(--green-light);
      background: var(--green-bg);
      color: var(--green-dark);
    }
    .login-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
    }
    .login-field:focus { border-color: var(--green-main); }
    .login-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .redeem-history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #fafafa;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .redeem-history-item button {
      background: #ffebee;
      border: none;
      color: #c62828;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 8px;
    }

    @media (max-width: 600px) {
      .main-layout { padding: 10px; }
      .sidebar { width: 58px; }
      .subject-btn { width: 52px; height: 52px; font-size: 10px; }
      .subject-btn .icon { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo-area">
      <span class="logo-sun">☀️</span>
      <span class="logo-title">阳光学习能量站</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <input type="text" class="name-input" id="childName" placeholder="孩子姓名" maxlength="8">
      <button class="admin-entry" id="adminEntry" title="家长管理">⚙️</button>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-chip">🔥 连续打卡 <strong id="streakDays">0</strong> 天</div>
    <div class="stat-chip">☀️ 阳光值 <strong id="sunshine">0</strong></div>
    <div class="stat-chip">⭐ 等级 <strong id="level">1</strong></div>
  </div>
  <div class="header-actions">
    <button class="btn-sm primary" id="checkinBtn">📅 今日打卡 +20☀️</button>
    <button class="btn-sm" id="exportBtn">📤 导出</button>
    <button class="btn-sm" id="importBtn">📥 导入</button>
    <input type="file" id="importFile" accept=".json">
  </div>
</div>

<div class="main-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="recommend-panel" id="recommendPanel">
      <h3>✨ 今日推荐</h3>
      <div class="recommend-list" id="recommendList"></div>
    </div>
    <div class="subject-header" id="subjectHeader">
      <h2 id="subjectTitle"></h2>
      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">0%</span>
      </div>
    </div>
    <div class="units-grid" id="unitsGrid"></div>
  </main>
</div>

<button class="shop-fab" id="shopFab" title="阳光兑换商店">🎁</button>

<div class="modal-overlay" id="shopModal">
  <div class="modal">
    <h3>🎁 阳光兑换商店</h3>
    <p class="balance">当前阳光：<strong id="shopBalance">0</strong> ☀️</p>
    <div id="shopList"></div>
    <button class="modal-close" id="shopClose">关闭</button>
  </div>
</div>

<div class="modal-overlay" id="adminLoginModal">
  <div class="modal">
    <h3>🔐 家长登录</h3>
    <p class="login-hint" id="loginHint">默认密码：888888（首次登录后可修改）</p>
    <input type="password" class="login-field" id="adminPassword" placeholder="请输入管理密码" maxlength="20">
    <button class="shop-btn" style="width:100%;padding:10px;border-radius:10px;" id="adminLoginBtn">登录</button>
    <button class="modal-close" id="adminLoginClose">取消</button>
  </div>
</div>

<div class="modal-overlay" id="adminPanelModal">
  <div class="modal">
    <h3>⚙️ 家长管理</h3>
    <div class="admin-panel-section">
      <h4>撤销操作</h4>
      <button class="admin-action-btn" id="undoCheckinBtn">↩️ 撤销今日打卡</button>
      <button class="admin-action-btn" id="undoLastRedeemBtn">↩️ 撤销最近一次兑换</button>
    </div>
    <div class="admin-panel-section" id="redeemHistorySection">
      <h4>兑换记录</h4>
      <div id="redeemHistoryList"></div>
    </div>
    <div class="admin-panel-section">
      <h4>修改密码</h4>
      <input type="password" class="login-field" id="newPassword" placeholder="新密码（至少4位）" maxlength="20">
      <input type="password" class="login-field" id="confirmPassword" placeholder="确认新密码" maxlength="20">
      <button class="admin-action-btn secondary" id="changePasswordBtn">保存新密码</button>
    </div>
    <button class="admin-action-btn secondary" id="adminLogoutBtn">退出登录</button>
    <button class="modal-close" id="adminPanelClose">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

      { title: '音乐', tasks: ['声乐练习 20 分钟', '乐器练习 15 分钟', '乐理知识复习', '歌曲欣赏与感受', '节奏训练'] }

      { title: '劳动实践', tasks: ['整理房间', '帮厨一项', '垃圾分类实践', '种植观察记录', '劳动日记'] },

const REWARDS = [
  { id: 'cartoon', name: '看一集动画片', desc: '完成兑换后请家长确认', cost: 60 },
  { id: 'game', name: '玩 30 分钟游戏', desc: '完成兑换后请家长确认', cost: 120 },
  { id: 'outing', name: '周末外出游玩', desc: '完成兑换后请家长确认', cost: 300 }
];

const TASK_REWARD = 5;
const CHECKIN_REWARD = 20;
const STORAGE_KEY = 'sunshine_learning_v1';
const ADMIN_KEY = 'sunshine_admin_v1';
const ADMIN_SESSION_KEY = 'sunshine_admin_session';
const DEFAULT_ADMIN_PASSWORD = '888888';

let state = loadState();
let currentSubject = SUBJECTS[0].id;
let isAdminLoggedIn = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1';

function defaultState() {
  return {
    childName: '小阳光',
    sunshine: 0,
    streak: 0,
    lastCheckin: '',
    completedTasks: {},
    redeemedRewards: []
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? { ...defaultState(), ...JSON.parse(raw) } : defaultState();
  } catch {
    return defaultState();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

async function hashPassword(password) {
  const data = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function loadAdminConfig() {
  try {
    const raw = localStorage.getItem(ADMIN_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
}

function saveAdminConfig(config) {
  localStorage.setItem(ADMIN_KEY, JSON.stringify(config));
}

async function getStoredPasswordHash() {
  const config = loadAdminConfig();
  if (config.passwordHash) return config.passwordHash;
  const hash = await hashPassword(DEFAULT_ADMIN_PASSWORD);
  saveAdminConfig({ passwordHash: hash });
  return hash;
}

async function verifyAdminPassword(password) {
  const inputHash = await hashPassword(password);
  const storedHash = await getStoredPasswordHash();
  return inputHash === storedHash;
}

function setAdminSession(loggedIn) {
  isAdminLoggedIn = loggedIn;
  if (loggedIn) sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
  else sessionStorage.removeItem(ADMIN_SESSION_KEY);
  updateAdminEntry();
}

function updateAdminEntry() {
  const btn = document.getElementById('adminEntry');
  btn.classList.toggle('logged-in', isAdminLoggedIn);
  btn.title = isAdminLoggedIn ? '家长管理（已登录）' : '家长管理';
}

function openAdminEntry() {
  if (isAdminLoggedIn) {
    renderAdminPanel();
    document.getElementById('adminPanelModal').classList.add('show');
  } else {
    document.getElementById('adminPassword').value = '';
    document.getElementById('adminLoginModal').classList.add('show');
    setTimeout(() => document.getElementById('adminPassword').focus(), 100);
  }
}

function renderAdminPanel() {
  const today = todayStr();
  const checkedInToday = state.lastCheckin === today;
  document.getElementById('undoCheckinBtn').disabled = !checkedInToday;
  document.getElementById('undoCheckinBtn').textContent = checkedInToday
    ? `↩️ 撤销今日打卡（-${CHECKIN_REWARD}☀️）`
    : '↩️ 撤销今日打卡（今天未打卡）';

  const hasRedeem = state.redeemedRewards.length > 0;
  const last = state.redeemedRewards[state.redeemedRewards.length - 1];
  document.getElementById('undoLastRedeemBtn').disabled = !hasRedeem;
  document.getElementById('undoLastRedeemBtn').textContent = hasRedeem
    ? `↩️ 撤销最近一次兑换（+${last.cost || REWARDS.find(r => r.id === last.id)?.cost || 0}☀️）`
    : '↩️ 撤销最近一次兑换（暂无记录）';

  const list = document.getElementById('redeemHistoryList');
  if (!state.redeemedRewards.length) {
    list.innerHTML = '<p style="font-size:13px;color:#999;">暂无兑换记录</p>';
    return;
  }
  list.innerHTML = [...state.redeemedRewards].reverse().map((item, revIdx) => {
    const reward = REWARDS.find(r => r.id === item.id);
    const cost = item.cost || reward?.cost || 0;
    const realIdx = state.redeemedRewards.length - 1 - revIdx;
    return `<div class="redeem-history-item">
      <span>${reward?.name || item.id} · ${item.date} · ${cost}☀️</span>
      <button data-idx="${realIdx}">撤销</button>
    </div>`;
  }).join('');
  list.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => undoRedemption(+btn.dataset.idx));
  });
}

function undoCheckin() {
  const today = todayStr();
  if (state.lastCheckin !== today) {
    showToast('今天还没有打卡，无需撤销');
    return;
  }
  if (state._checkinBackup) {
    state.sunshine = state._checkinBackup.sunshine;
    state.streak = state._checkinBackup.streak;
    state.lastCheckin = state._checkinBackup.lastCheckin;
    delete state._checkinBackup;
  } else {
    state.sunshine = Math.max(0, state.sunshine - CHECKIN_REWARD);
    state.streak = Math.max(0, state.streak - 1);
    state.lastCheckin = '';
  }
  saveState();
  showToast(`已撤销今日打卡，-${CHECKIN_REWARD}☀️`);
  render();
  renderAdminPanel();
}

function undoRedemption(index) {
  if (index < 0 || index >= state.redeemedRewards.length) return;
  const item = state.redeemedRewards[index];
  const reward = REWARDS.find(r => r.id === item.id);
  const cost = item.cost || reward?.cost || 0;
  state.redeemedRewards.splice(index, 1);
  state.sunshine += cost;
  saveState();
  showToast(`已撤销兑换：${reward?.name || item.id}，+${cost}☀️`);
  render();
  renderAdminPanel();
}

function undoLastRedemption() {
  if (!state.redeemedRewards.length) {
    showToast('暂无兑换记录');
    return;
  }
  undoRedemption(state.redeemedRewards.length - 1);
}

async function loginAdmin() {
  const password = document.getElementById('adminPassword').value;
  if (!password) {
    showToast('请输入密码');
    return;
  }
  const ok = await verifyAdminPassword(password);
  if (!ok) {
    showToast('密码错误');
    return;
  }
  setAdminSession(true);
  document.getElementById('adminLoginModal').classList.remove('show');
  renderAdminPanel();
  document.getElementById('adminPanelModal').classList.add('show');
  showToast('家长登录成功');
}

async function changeAdminPassword() {
  const next = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if (next.length < 4) {
    showToast('新密码至少 4 位');
    return;
  }
  if (next !== confirm) {
    showToast('两次密码不一致');
    return;
  }
  const hash = await hashPassword(next);
  saveAdminConfig({ passwordHash: hash });
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
  showToast('密码修改成功');
}

function logoutAdmin() {
  setAdminSession(false);
  document.getElementById('adminPanelModal').classList.remove('show');
  showToast('已退出家长登录');
}

function taskKey(subjectId, unitIdx, taskIdx) {
  return `${subjectId}:${unitIdx}:${taskIdx}`;
}

function getLevel(sunshine) {
  if (sunshine >= 1000) return 5;
  if (sunshine >= 600) return 4;
  if (sunshine >= 300) return 3;
  if (sunshine >= 100) return 2;
  return 1;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getAllTasks() {
  const tasks = [];
  SUBJECTS.forEach(sub => {
    sub.units.forEach((unit, ui) => {
      unit.tasks.forEach((name, ti) => {
        tasks.push({
          subjectId: sub.id,
          subjectName: sub.name,
          unitIdx: ui,
          taskIdx: ti,
          name,
          key: taskKey(sub.id, ui, ti),
          done: !!state.completedTasks[taskKey(sub.id, ui, ti)]
        });
      });
    });
  });
  return tasks;
}

function getSubjectProgress(subject) {
  let total = 0, done = 0;
  subject.units.forEach((unit, ui) => {
    unit.tasks.forEach((_, ti) => {
      total++;
      if (state.completedTasks[taskKey(subject.id, ui, ti)]) done++;
    });
  });
  return total ? Math.round((done / total) * 100) : 0;
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = SUBJECTS.map(sub => {
    const active = sub.id === currentSubject ? 'active' : '';
    const progress = getSubjectProgress(sub);
    return `<button class="subject-btn ${active}" data-id="${sub.id}" style="${active ? `background:${sub.color}` : ''}" title="${sub.name} ${progress}%">
      <span class="icon">${sub.icon}</span>
      <span>${sub.name}</span>
    </button>`;
  }).join('');
  sidebar.querySelectorAll('.subject-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSubject = btn.dataset.id;
      render();
    });
  });
}

function renderRecommend() {
  const list = document.getElementById('recommendList');
  const undone = getAllTasks().filter(t => !t.done);
  const picks = shuffle(undone).slice(0, 3);
  if (!picks.length) {
    list.innerHTML = '<p style="color:#999;font-size:14px;">🎉 太棒了，所有任务都完成了！</p>';
    return;
  }
  list.innerHTML = picks.map(t => `
    <div class="recommend-item" data-subject="${t.subjectId}" data-ui="${t.unitIdx}" data-ti="${t.taskIdx}">
      <span class="tag">${t.subjectName}</span>
      <span>${t.name}</span>
      <span class="reward">+${TASK_REWARD}☀️</span>
    </div>
  `).join('');
  list.querySelectorAll('.recommend-item').forEach(item => {
    item.addEventListener('click', () => {
      currentSubject = item.dataset.subject;
      render();
      const key = taskKey(item.dataset.subject, +item.dataset.ui, +item.dataset.ti);
      if (!state.completedTasks[key]) toggleTask(key);
    });
  });
}

function renderSubject() {
  const sub = SUBJECTS.find(s => s.id === currentSubject);
  if (!sub) return;
  const progress = getSubjectProgress(sub);
  document.getElementById('subjectTitle').innerHTML = `${sub.icon} ${sub.name}`;
  document.getElementById('progressFill').style.width = progress + '%';
  document.getElementById('progressFill').style.background = sub.color;
  document.getElementById('progressText').textContent = progress + '%';
  document.getElementById('progressText').style.color = sub.color;

  const grid = document.getElementById('unitsGrid');
  grid.innerHTML = sub.units.map((unit, ui) => `
    <div class="unit-card">
      <h4>${unit.title}</h4>
      <div class="task-list">
        ${unit.tasks.map((name, ti) => {
          const key = taskKey(sub.id, ui, ti);
          const done = !!state.completedTasks[key];
          return `<div class="task-item ${done ? 'done' : ''}" data-key="${key}">
            <div class="task-checkbox">${done ? '✓' : ''}</div>
            <span class="task-name">${name}</span>
            <span class="task-reward">+${TASK_REWARD}☀️</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.task-item').forEach(item => {
    item.addEventListener('click', () => toggleTask(item.dataset.key));
  });
}

function renderHeader() {
  document.getElementById('childName').value = state.childName;
  document.getElementById('streakDays').textContent = state.streak;
  document.getElementById('sunshine').textContent = state.sunshine;
  document.getElementById('level').textContent = getLevel(state.sunshine);
  document.getElementById('shopBalance').textContent = state.sunshine;

  const today = todayStr();
  const btn = document.getElementById('checkinBtn');
  if (state.lastCheckin === today) {
    btn.disabled = true;
    btn.textContent = '✅ 今日已打卡';
  } else {
    btn.disabled = false;
    btn.textContent = '📅 今日打卡 +20☀️';
  }
}

function renderShop() {
  document.getElementById('shopList').innerHTML = REWARDS.map(r => {
    const canAfford = state.sunshine >= r.cost;
    return `<div class="shop-item">
      <div class="shop-item-info">
        <h4>${r.name}</h4>
        <p>${r.desc}</p>
      </div>
      <span class="cost">${r.cost}☀️</span>
      <button class="shop-btn" data-id="${r.id}" ${canAfford ? '' : 'disabled'}>兑换</button>
    </div>`;
  }).join('');
  document.getElementById('shopList').querySelectorAll('.shop-btn').forEach(btn => {
    btn.addEventListener('click', () => redeemReward(btn.dataset.id));
  });
}

function render() {
  renderHeader();
  renderSidebar();
  renderRecommend();
  renderSubject();
  renderShop();
}

function toggleTask(key) {
  if (state.completedTasks[key]) {
    delete state.completedTasks[key];
    state.sunshine = Math.max(0, state.sunshine - TASK_REWARD);
    showToast(`取消任务，-${TASK_REWARD}☀️`);
  } else {
    state.completedTasks[key] = true;
    state.sunshine += TASK_REWARD;
    showToast(`完成任务！+${TASK_REWARD}☀️`);
  }
  saveState();
  render();
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function doCheckin() {
  const today = todayStr();
  if (state.lastCheckin === today) return;
  state._checkinBackup = {
    lastCheckin: state.lastCheckin,
    streak: state.streak,
    sunshine: state.sunshine
  };
  const yesterday = yesterdayStr();
  if (state.lastCheckin === yesterday) {
    state.streak += 1;
  } else {
    state.streak = 1;
  }
  state.lastCheckin = today;
  state.sunshine += CHECKIN_REWARD;
  saveState();
  showToast(`打卡成功！+${CHECKIN_REWARD}☀️ 连续 ${state.streak} 天`);
  render();
}

function redeemReward(id) {
  const reward = REWARDS.find(r => r.id === id);
  if (!reward || state.sunshine < reward.cost) return;
  state.sunshine -= reward.cost;
  state.redeemedRewards.push({ id, date: todayStr(), cost: reward.cost });
  saveState();
  showToast(`兑换成功：${reward.name}（请找家长确认哦）`);
  render();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `阳光学习能量站_${state.childName}_${todayStr()}.json`;
  a.click();
  showToast('数据已导出');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      state = { ...defaultState(), ...data };
      saveState();
      render();
      showToast('数据导入成功！');
    } catch {
      showToast('导入失败，文件格式不对');
    }
  };
  reader.readAsText(file);
}

document.getElementById('childName').addEventListener('change', e => {
  state.childName = e.target.value || '小阳光';
  saveState();
});
document.getElementById('childName').addEventListener('blur', e => {
  state.childName = e.target.value || '小阳光';
  saveState();
});
document.getElementById('checkinBtn').addEventListener('click', doCheckin);
document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  if (e.target.files[0]) importData(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('shopFab').addEventListener('click', () => {
  document.getElementById('shopModal').classList.add('show');
  renderShop();
});
document.getElementById('shopClose').addEventListener('click', () => {
  document.getElementById('shopModal').classList.remove('show');
});
document.getElementById('shopModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
});

document.getElementById('adminEntry').addEventListener('click', openAdminEntry);
document.getElementById('adminLoginBtn').addEventListener('click', loginAdmin);
document.getElementById('adminPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') loginAdmin();
});
document.getElementById('adminLoginClose').addEventListener('click', () => {
  document.getElementById('adminLoginModal').classList.remove('show');
});
document.getElementById('adminLoginModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
});
document.getElementById('adminPanelClose').addEventListener('click', () => {
  document.getElementById('adminPanelModal').classList.remove('show');
});
document.getElementById('adminPanelModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
});
document.getElementById('undoCheckinBtn').addEventListener('click', undoCheckin);
document.getElementById('undoLastRedeemBtn').addEventListener('click', undoLastRedemption);
document.getElementById('changePasswordBtn').addEventListener('click', changeAdminPassword);
document.getElementById('adminLogoutBtn').addEventListener('click', logoutAdmin);

updateAdminEntry();
render();
</script>
